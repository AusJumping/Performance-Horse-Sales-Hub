kind = "web"
previewPath = "/"
title = "Performance Horse Sales Hub"
version = "1.0.0"
id = "artifacts/phs-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19363

[services.development]
run = "pnpm --filter @workspace/phs-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phs-hub", "run", "build" ]
publicDir = "artifacts/phs-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19363"
BASE_PATH = "/"
